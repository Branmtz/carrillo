<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Uniformes Carrillo" />
    <meta name="description" content="Uniformes Carrillo - Punto de Venta, Confección y Control de Entregas de Uniformes Escolares" />
    <title>Uniformes Carrillo - Punto de Venta y Control de Pedidos</title>
  </head>
  <body class="bg-slate-50 text-slate-900 select-none-form">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('ServiceWorker registrado exitosamente con scope:', reg.scope);
            })
            .catch(err => {
              console.warn('Error al registrar ServiceWorker:', err);
            });
        });
      }
    </script>
  </body>
</html>
